<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Letters – love letters you can scan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@500&family=Inter:wght@400;600&family=Lora&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--c:#b8364c;--bg:#fff7f3;--ink:#4a2530;--ln:#efd5d3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0}
.wrap{max-width:1080px;margin:auto;padding:20px}
#nv{display:flex;justify-content:space-between;align-items:center;max-width:1080px;margin:auto;padding:14px 20px}
#nv a,#nv button{color:var(--ink);margin-left:14px;font:600 14px Inter;background:none;border:0;cursor:pointer;text-decoration:none}
#nv .brand{color:var(--c);font-size:28px;margin:0}
.btn{border:0;border-radius:999px;padding:11px 22px;background:var(--c);color:#fff;font:600 15px Inter;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #b8364c33}.btn:disabled{opacity:.5}
.btn.o{background:#fff;color:var(--c);border:1px solid var(--c)}.btn.s{padding:6px 13px;font-size:13px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #7a2b3a14}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;font:inherit;background:#fff;color:inherit}
input[type=color]{padding:2px;height:42px}input[type=checkbox]{width:auto}
label{display:block;font-size:13px;font-weight:600;margin:13px 0 4px}label.k{display:flex;gap:8px;align-items:center;font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sticky{position:sticky;top:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:30px 0}
.hero h1{font-size:clamp(40px,6vw,66px);line-height:1.02;margin-bottom:14px}.hero canvas{width:100%;max-width:420px;justify-self:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.steps h3{font-size:24px;margin-bottom:6px}
@media(max-width:800px){.grid,.hero,.steps{grid-template-columns:1fr}.sticky{position:static}}
.paper{position:relative;max-width:520px;margin:auto;padding:44px 32px;border-radius:6px;box-shadow:0 10px 40px #0002;line-height:1.7;overflow:hidden;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.paper h1{font-size:2em;text-align:center;margin-bottom:14px}.paper p{margin:0 0 12px;white-space:pre-wrap}
.gl{text-align:center;letter-spacing:10px;font-size:14px;opacity:.85}
.rib{position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(90deg,#d95d77,#f4a3b5,#d95d77)}
.ph{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.ph img{width:46%;min-width:120px;max-height:240px;object-fit:cover;background:#fff;padding:6px 6px 22px;box-shadow:0 3px 10px #0003;transform:rotate(-2deg)}.ph img:nth-child(2n){transform:rotate(2deg)}
#th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#th span{position:relative}#th img{width:64px;height:64px;object-fit:cover;border-radius:10px}
#th b{position:absolute;top:-6px;right:-6px;background:var(--c);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer;font-size:13px}
#qc{width:100%;max-width:380px;display:block;margin:auto}.warn{color:#b00020;font-size:13px}
#rec{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 25%,#fff,#f6d6d8)}
.env{position:relative;width:min(330px,86vw);height:216px;border-radius:6px;cursor:pointer;margin:auto;box-shadow:0 14px 40px #7a2b3a40;
background:linear-gradient(26deg,#dc8594 50%,transparent 50%),linear-gradient(-26deg,#e393a0 50%,transparent 50%),#eaa5b1;transition:transform 1s .9s,opacity 1s .9s}
.flap{position:absolute;top:0;left:0;right:0;height:62%;background:#d27888;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:2}
.seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#b3243c;color:#fff;display:grid;place-items:center;font-size:22px;z-index:3;transition:.4s;animation:pu 1.8s infinite}
@keyframes pu{50%{transform:scale(1.1)}}.env.open{transform:translateY(30px) scale(.9);opacity:0}.env.open .flap{transform:rotateX(180deg)}.env.open .seal{opacity:0;animation:none}
.fl{position:fixed;bottom:-30px;color:#e0647d;animation:up linear forwards;pointer-events:none}@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.unf{animation:unf 1.1s ease both;width:100%}@keyframes unf{from{opacity:0;transform:translateY(50px) scale(.9)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#4a2530;color:#fff;padding:10px 18px;border-radius:999px;z-index:9;display:none;max-width:90vw}
body.rv #nv{display:none}#pa{display:none}.pf{border:3px double var(--c);padding:14mm;text-align:center;font-family:'Cormorant Garamond',serif;min-height:270mm}.pf img{width:15cm;max-width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body.pr>*:not(#pa){display:none!important}#pa{display:block}body{background:#fff}.paper{box-shadow:none}}

const SUPABASE_URL="https://akmjqblkulgvqzofthks.supabase.co",SUPABASE_KEY="sb_publishable_szDFKWScx_y8b5OK12FUuw_t2hs0DX7";

//HEART-START
function drawHeart(cv,text,o){
 const q=qrcode(0,o.center?'H':'Q');q.addData(text);q.make();
 const n=q.getModuleCount(),S=cv.width,x=cv.getContext('2d'),T=-3*Math.PI/4,cs=Math.cos(T),sn=Math.sin(T);
 // The real QR is the square (0..n). Two half-circles on its two upper edges make the heart; the QR is rotated so one corner points down.
 const P=[[0,0],[n,0],[0,n],[n,n]];for(let a=0;a<64;a++){const t=a/64*6.2832;P.push([n+Math.cos(t)*n/2,n/2+Math.sin(t)*n/2],[n/2+Math.cos(t)*n/2,n+Math.sin(t)*n/2])}
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[px,py]of P){const u=px-n/2,v=py-n/2,wx=u*cs-v*sn,wy=u*sn+v*cs;x0=Math.min(x0,wx);x1=Math.max(x1,wx);y0=Math.min(y0,wy);y1=Math.max(y1,wy)}
 const s=S*.9/Math.max(x1-x0,y1-y0);
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#fff';x.fillRect(0,0,S,S);x.save();
 x.translate(S/2,S/2);x.scale(s,s);x.translate(-(x0+x1)/2,-(y0+y1)/2);x.rotate(T);x.translate(-n/2,-n/2);
 const g=x.createLinearGradient(n,n,0,0);g.addColorStop(0,o.c1);g.addColorStop(1,o.c2);x.fillStyle=g;
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(c-.02,r-.02,1.04,1.04);
 let h=0;for(const ch of text)h=Math.imul(h^ch.charCodeAt(0),2654435761)>>>0;
 const rnd=()=>{h=h+1831565813>>>0;let t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296};
 const m=Math.ceil(n*1.5)+2; // decorative modules fill the lobes only, leaving a 2-module gap around the scannable square
 for(let r=-2;r<m;r++)for(let c=-2;c<m;c++){const cx=c+.5,cy=r+.5,a=c>=n+2&&Math.hypot(cx-n,cy-n/2)<=n/2,b=r>=n+2&&Math.hypot(cx-n/2,cy-n)<=n/2;if((a||b)&&rnd()<.5)x.fillRect(c-.02,r-.02,1.04,1.04)}
 if(o.center){x.translate(n/2,n/2);x.rotate(-T);const hp=k=>{x.beginPath();x.moveTo(0,k*.45);x.bezierCurveTo(-k,-k*.15,-k*.5,-k*.75,0,-k*.25);x.bezierCurveTo(k*.5,-k*.75,k,-k*.15,0,k*.45);x.fill()};
  x.fillStyle='#fff';hp(n*.17);x.fillStyle=o.c1;hp(n*.12)}
 x.restore()}
//HEART-END

// ---------- routing ----------
const go=h=>location.hash===h?route():location.hash=h;
async function authed(){return OK&&(await sb.auth.getSession()).data.session}
async function nav(){const s=await authed();$('#nv').innerHTML=`<a class="brand" href="#/">Little Letters</a><span><a href="#/new">Write</a>${s?'<a href="#/dash">My letters</a><button id="so">Sign out</button>':'<a href="#/in">Sign in</a>'}</span>`;if(s)$('#so').onclick=async()=>{await sb.auth.signOut();go('#/')}}
async function route(){document.body.className='';const[,p,id]=location.hash.split('/');await nav();window.scrollTo(0,0);
 app.onclick=null;(({'':home,in:signin,dash,new:()=>edit(),edit:()=>edit(id),qr:()=>qrp(id),l:()=>rec(id)})[p||'']||home)()}
addEventListener('hashchange',route);

function home(){app.innerHTML=`<div class="wrap"><section class="hero"><div><h1>Write a letter.<br>Hand it over as a heart.</h1><p style="font-size:18px;max-width:30em">Write something real, add your photos, and print a heart-shaped QR code for a card, a gift or a wall. When they scan it, an envelope opens on their phone.</p><p><a class="btn" href="#/new">Write a letter</a> <a class="btn o" href="#/dash">My letters</a></p>${OK?'':`<p class="warn">${NOCFG}</p>`}</div><canvas id="hc" width="900" height="900" aria-label="Sample heart-shaped QR code"></canvas></section>

 drawHeart($('#hc'),'https://example.com/#/l/sample0000',{c1:'#b8364c',c2:'#d9566f'})}

async function signin(){if(!OK)return msg(NOCFG);app.innerHTML=`<div class="wrap" style="max-width:460px"><div class="card"><h2>Sign in</h2><p>Enter your email and we will send you a sign-in link. Open it in this same browser.</p><label>Email</label><input id="em" type="email" autocomplete="email"><p><button class="btn" id="go">Send link</button></p></div></div>`;
 $('#go').onclick=async()=>{const email=$('#em').value.trim();if(!email)return;busy(1);const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:base()}});busy(0);error?toast('Could not send: '+error.message):msg('Check your inbox for the sign-in link.')}}

OK&&sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_IN'){nav();if(fl||/#\/in/.test(location.hash)){fl=false;go('#/dash')}}});

// ---------- dashboard ----------
async function dash(){if(!OK)return msg(NOCFG);if(!await authed())return go('#/in');
 const{data,error}=await sb.from('letters').select('id,status,data,updated_at').order('updated_at',{ascending:false});if(error)return msg('Could not load letters: '+error.message);
 app.innerHTML=`<div class="wrap"><div class="row"><h2>My letters</h2><a class="btn" href="#/new">Create new letter</a></div>${data.length?data.map(r=>`<div class="card row" data-id="${r.id}"><div><b>${esc(r.data.title||'Untitled')}</b><br><small>For ${esc(r.data.to||'-')}, ${r.status}, edited ${new Date(r.updated_at).toLocaleDateString()}</small></div><div class="acts"><button class="btn s o" data-a="edit">${r.status==='draft'?'Edit draft':'Edit'}</button>${r.status==='published'?'<button class="btn s o" data-a="qr">QR code</button><button class="btn s o" data-a="view">Preview</button><button class="btn s o" data-a="copy">Copy link</button>':''}<button class="btn s o" data-a="tog">${r.status==='published'?'Unpublish':'Publish'}</button><button class="btn s o" data-a="del">Delete</button></div></div>`).join(''):'<div class="card"><p>No letters yet. Write your first one.</p></div>'}</div>`;
 app.onclick=async e=>{const a=e.target.dataset.a,id=e.target.closest('[data-id]')?.dataset.id,r=data.find(x=>x.id===id);if(!a||!r)return;
  if(a==='edit')go('#/edit/'+id);if(a==='qr')go('#/qr/'+id);if(a==='view')open(link(id),'_blank');if(a==='copy')copy(link(id));
  if(a==='tog'){const{error}=await sb.from('letters').update({status:r.status==='published'?'draft':'published',updated_at:new Date().toISOString()}).eq('id',id);error?toast('Failed: '+error.message):(toast(r.status==='published'?'Unpublished. The link no longer works.':'Published'),dash())}
  if(a==='del'&&confirm('Delete this letter and its photos for good? Its link and QR code will stop working.')){const ps=(r.data.photos||[]);if(ps.length){const{error:e1}=await sb.storage.from('letter-photos').remove(ps);if(e1)return toast('Photos not removed, letter kept: '+e1.message)}
   const{error}=await sb.from('letters').delete().eq('id',id);error?toast('Failed: '+error.message):(toast('Deleted'),dash())}}}

// ---------- editor ----------
const shrink=f=>new Promise((ok,no)=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>15e6)return no(Error('Use a JPG, PNG or WebP under 15 MB'));const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(Error('Could not process image')),'image/jpeg',.82)};i.onerror=()=>no(Error('Not a readable image'));i.src=URL.createObjectURL(f)});
async function edit(id){rmv=[];
 if(id){if(!OK)return msg(NOCFG);const{data,error}=await sb.from('letters').select('data,status').eq('id',id).single();if(error||!data)return msg('Letter not found, or it is not yours.');L={...blank(),...data.data,photos:(data.data.photos||[]).map(p=>({path:p}))};status=data.status;cur=id}
 else{cur=null;status='draft';let d={};try{d=JSON.parse(localStorage.getItem('ll')||'{}')}catch{}L={...blank(),...d,photos:[]}}
 const inp=(k,l,t='text')=>`<label>${l}</label><input data-k="${k}" type="${t}" value="${esc(L[k])}">`,opt=(o,v)=>Object.keys(o).map(k=>`<option ${k===v?'selected':''}>${k}</option>`).join('');
 app.innerHTML=`<div class="wrap grid"><form class="card" id="f" onsubmit="return false">${OK?'':`<p class="warn">${NOCFG}</p>`}<div class="g3" style="grid-template-columns:1fr 1fr">${inp('to','Recipient name')}${inp('from','Your name')}</div>${inp('title','Title')}${inp('greet','Greeting')}<label>Letter</label><textarea data-k="body" rows="9" placeholder="Write from the heart. A blank line starts a new paragraph.">${esc(L.body)}</textarea>${inp('close','Closing')}
 <div class="g3"><div><label>Theme</label><select data-k="theme">${opt(TH,L.theme)}</select></div><div><label>Font</label><select data-k="font">${opt(FONTS,L.font)}</select></div><div><label>Decoration</label><select data-k="deco">${opt({none:1,hearts:1,flowers:1,stars:1,ribbon:1},L.deco)}</select></div></div>
 <div class="g3"><div><label>Text color</label><input type="color" data-k="ink" value="${col(L.ink)}"></div><div><label>Paper color</label><input type="color" data-k="bg" value="${col(L.bg)}"></div><div><label>Accent</label><input type="color" data-k="ac" value="${col(L.ac)}"></div></div>
 <label>Photos (up to 3)</label><input type="file" id="ph" accept="image/jpeg,image/png,image/webp" multiple><div id="th"></div>
 <label>Password (optional)</label><input id="pw" type="password" autocomplete="new-password" placeholder="Leave blank to keep the current setting"><label class="k"><input type="checkbox" id="rm"> Remove password</label>
 <p class="row" style="margin-top:20px"><button class="btn o" id="sv">${status==='published'?'Save changes':'Save draft'}</button><button class="btn" id="pb">${status==='published'?'Save and open QR':'Publish and get QR'}</button></p></form><div class="sticky" id="pv"></div></div>`;
 const pv=()=>{$('#pv').innerHTML=paper(L,L.photos.map(psrc));$('#th').innerHTML=L.photos.map((p,i)=>`<span><img src="${esc(psrc(p))}" alt=""><b data-i="${i}">×</b></span>`).join('')};pv();
 $('#f').oninput=e=>{const k=e.target.dataset.k;if(!k)return;L[k]=e.target.value;if(k==='theme'){const t=TH[L.theme];[L.bg,L.ink,L.ac,L.deco]=t;for(const[kk,v]of[['bg',t[0]],['ink',t[1]],['ac',t[2]],['deco',t[3]]])$(`[data-k=${kk}]`).value=v}
  pv();if(!cur)localStorage.setItem('ll',JSON.stringify({...L,photos:[]}))};
 $('#th').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;const p=L.photos.splice(i,1)[0];if(p.path)rmv.push(p.path);pv()};
 $('#ph').onchange=async e=>{for(const f of e.target.files){if(L.photos.length>=3){toast('Three photos maximum');break}try{const b=await shrink(f);L.photos.push({blob:b,src:URL.createObjectURL(b)})}catch(er){toast(er.message)}}e.target.value='';pv()};
 $('#sv').onclick=()=>save(false);$('#pb').onclick=()=>save(true)}
async function save(pub){if(!OK)return toast('Not saved: the site has no database configured yet.');
 const s=(await sb.auth.getSession()).data.session;if(!s){localStorage.setItem('ll',JSON.stringify({...L,photos:[]}));toast('Sign in to save. Your text is kept; photos must be added again.');return go('#/in')}
 if(!L.to.trim()||!L.body.trim())return toast('Add a recipient name and write your letter first.');
 busy(1);try{const id=cur||rid(),paths=[];
  for(const p of L.photos){if(p.blob){const path=`${s.user.id}/${id}/${rid()}.jpg`,{error}=await sb.storage.from('letter-photos').upload(path,p.blob,{contentType:'image/jpeg'});if(error)throw error;p.path=path;delete p.blob}paths.push(p.path)}
  const pw=$('#rm').checked?'':($('#pw').value||null),{error}=await sb.rpc('save_letter',{p_id:id,p_data:{...L,photos:paths},p_status:pub?'published':status,p_pw:pw});if(error)throw error;
  if(rmv.length){await sb.storage.from('letter-photos').remove(rmv);rmv=[]}
  cur=id;if(pub){localStorage.removeItem('ll');go('#/qr/'+id)}else{toast('Saved');history.replaceState(0,'','#/edit/'+id)}}
 catch(e){toast('Not saved: '+(e.message||e))}finally{busy(0)}}

// ---------- QR result page ----------
async function qrp(id){if(!OK)return msg(NOCFG);const{data:r,error}=await sb.from('letters').select('data,status').eq('id',id).single();
 if(error||!r)return msg('Letter not found, or it is not yours.');if(r.status!=='published')return msg('This letter is not published, so it has no working link.','#/edit/'+id,'Open the editor');
 const url=link(id),d=r.data;app.innerHTML=`<div class="wrap grid"><div class="card"><canvas id="qc" width="2000" height="2000"></canvas><p style="text-align:center;word-break:break-all"><small>${esc(url)}</small></p></div>
 <div class="card"><h2>Your letter is live</h2><p>Scan the code with a phone camera to check it before you print.</p><div class="g3" style="grid-template-columns:1fr 1fr"><div><label>Color</label><input type="color" id="c1" value="#b8364c"></div><div><label>Gradient to</label><input type="color" id="c2" value="#d9566f"></div></div><p class="warn" id="lw"></p>
 <label class="k"><input type="checkbox" id="ct"> Small heart in the center (uses stronger error correction)</label><label>Message on the printed card</label><input id="pm" value="${esc('For '+d.to+', with love')}">
 <p class="acts" style="margin-top:18px"><button class="btn" id="d1">Download QR (PNG)</button><button class="btn" id="d2">Download for print (PDF)</button><button class="btn o" id="d3">Print QR</button><button class="btn o" id="d4">Download letter (PDF)</button><button class="btn o" id="d5">Copy link</button><a class="btn o" href="${url}" target="_blank" rel="noopener">Preview letter</a><a class="btn o" href="#/dash">My letters</a></p></div></div>`;
 const cv=$('#qc'),dr=()=>{const o={c1:col($('#c1').value),c2:col($('#c2').value),center:$('#ct').checked};$('#lw').textContent=lum(o.c1)>.45||lum(o.c2)>.45?'These colors are too light to scan reliably. Pick darker ones.':'';drawHeart(cv,url,o)};dr();
 for(const i of['#c1','#c2','#ct'])$(i).oninput=dr;$('#d5').onclick=()=>copy(url);
 $('#d1').onclick=()=>cv.toBlob(b=>dl(b,'heart-qr.png'));
 $('#d2').onclick=()=>{const p=new jspdf.jsPDF({unit:'mm',format:'a4'}),c=col($('#c1').value);p.setDrawColor(c);p.setLineWidth(1.2);p.rect(10,10,190,277);p.setLineWidth(.3);p.rect(14,14,182,269);p.setFont('times','italic');p.setFontSize(28);p.text('A letter for you',105,48,{align:'center'});p.addImage(cv.toDataURL('image/png'),'PNG',30,65,150,150);p.setFontSize(16);p.text(p.splitTextToSize($('#pm').value,150),105,235,{align:'center'});p.setFont('helvetica','normal');p.setFontSize(9);p.text('Point your phone camera at the heart to open it',105,272,{align:'center'});p.save('heart-qr-print.pdf')};
 $('#d3').onclick=()=>printEl(`<div class="pf"><h1 style="font-size:40px;color:${col($('#c1').value)}">A letter for you</h1><p><img src="${cv.toDataURL('image/png')}" alt="QR code"></p><p style="font-size:24px">${esc($('#pm').value)}</p></div>`);
 $('#d4').onclick=()=>printEl(paper({...blank(),...d},(d.photos||[]).map(p=>psrc({path:p}))));toast('Choose "Save as PDF" in the print dialog to download the letter.')}

// ---------- recipient ----------
async function rec(id){document.body.className='rv';if(!OK)return app.innerHTML=`<div id="rec"><p>${esc(NOCFG)}</p></div>`;let pw=null,tries=0;
 const load=async()=>{app.innerHTML='<div id="rec"><p>Opening…</p></div>';const{data,error}=await sb.rpc('get_letter',{p_id:id,p_pw:pw});const R=$('#rec');
  if(error)return R.innerHTML='<p>This letter could not be loaded. Check your connection and try again.</p>';
  if(!data)return R.innerHTML='<div class="card"><h2>This letter is no longer available</h2><p>The sender may have removed it.</p></div>';
  if(data.locked){R.innerHTML=`<div class="card" style="max-width:360px"><h2>A private letter</h2><p>${tries?'That password did not match.':'Enter the password the sender gave you.'}</p><input id="p" type="password" autocomplete="off"><p><button class="btn" id="u">Unlock</button></p></div>`;$('#u').onclick=()=>{pw=$('#p').value;tries++;load()};return}
  const d={...blank(),...data},src=(data.photos||[]).map(p=>psrc({path:p}));
  R.innerHTML=`<div style="text-align:center;width:100%"><div class="env" id="ev"><div class="flap"></div><div class="seal">♥</div></div><p style="font-family:'Cormorant Garamond',serif;font-size:24px;margin-top:26px" id="tp">A letter for ${esc(d.to)}.<br><small style="font-family:Inter;font-size:14px">Tap the envelope to open it</small></p></div>`;
  $('#ev').onclick=()=>{$('#ev').classList.add('open');$('#tp').style.opacity=0;for(let i=0;i<16;i++){const s=document.createElement('span');s.className='fl';s.textContent='♥';s.style.cssText=`left:${Math.random()*95}vw;font-size:${14+Math.random()*22}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*1.6}s`;document.body.append(s);setTimeout(()=>s.remove(),8000)}
   setTimeout(()=>{R.innerHTML=`<div class="unf">${paper(d,src)}</div>`},1700)}};
 load()}
route();
</script>
